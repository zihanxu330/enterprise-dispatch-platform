<script>
(function(){
  var rect = document.getElementById('revealRect');
  var pen = document.getElementById('pen');
  var duration = 2600;
  var w = 1536, h = 1024;
  function animate(){
    var start = null;
    rect.setAttribute('width', 0);
    function step(ts){
      if(!start) start = ts;
      var t = Math.min((ts - start) / duration, 1);
      var eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      var x = eased * w;
      rect.setAttribute('width', x);
      pen.setAttribute('cx', x);
      pen.setAttribute('cy', h/2 + Math.sin(t*Math.PI*3)*40);
      if(t < 1){ requestAnimationFrame(step); }
      else { pen.style.opacity = 0; }
    }
    pen.style.opacity = 1;
    requestAnimationFrame(step);
  }
  animate();
  document.getElementById('replay').addEventListener('click', animate);
})();
</script>
