<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiajia Signature · Loading Portal V2</title>
<style>
  :root{
    --bg-0:#08090c;
    --bg-1:#0f1218;
    --ink-1:#f5f0e6;
    --ink-2:#d9c9a3;
    --accent:#7fd9d1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 38%, var(--bg-1) 0%, var(--bg-0) 70%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  .stage{ position:relative; width:min(88vw,660px); display:flex; justify-content:center; }
  .stage::before{
    content:"";
    position:absolute; inset:-18% -10%;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
    pointer-events:none; filter:blur(2px);
  }
  svg{ width:100%; height:auto; display:block; overflow:visible; }
  .signature-path{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  .stroke-glow{ stroke:var(--accent); stroke-width:7; opacity:0.18; filter:blur(4px); }
  .stroke-main{ stroke:url(#inkGradient); stroke-width:3.1; }

  .progress-line-glow{ stroke:var(--accent); stroke-width:8; opacity:0.35; filter:blur(5px); }
  .progress-line-main{ stroke:var(--accent); stroke-width:3.5; }

  .i-dot{
    fill:url(#inkGradient);
    opacity:0;
    transform-origin:634px 85px;
    transform:scale(0);
    transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .i-dot.active{ opacity:1; transform:scale(1); filter:drop-shadow(0 0 8px var(--accent)); }

  /* 钢笔粒子：写字时是“实时笔尖”，会随进度沿路径移动；
     cx/cy 的过渡让它在冲向 i 点时是一次平滑的飞行，而不是瞬移 */
  .pen-dot{
    fill:var(--accent);
    opacity:0;
    filter:drop-shadow(0 0 8px var(--accent));
    transition:cx .32s cubic-bezier(0.22,1,0.36,1), cy .32s cubic-bezier(0.22,1,0.36,1), opacity .2s ease;
  }

  @keyframes stampPulse{
    0%{ opacity:0; transform:scale(3); }
    50%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.5); }
  }

  .loading-status{
    margin-top:34px; font-size:13px; letter-spacing:0.25em;
    color:var(--accent); text-transform:uppercase; font-weight:300; transition:all 0.5s ease;
  }
  .loading-status span{ font-family:monospace; display:inline-block; width:45px; text-align:right; }

  .control-panel{ margin-top:20px; display:flex; gap:15px; }
  .btn{
    padding:8px 20px; font-size:12px; letter-spacing:0.05em; color:var(--ink-1);
    background:rgba(255,255,255,0.02); border:1px solid rgba(127,217,209,0.3);
    border-radius:999px; cursor:pointer; transition:all .2s ease;
  }
  .btn:hover{ background:rgba(127,217,209,0.1); border-color:var(--accent); box-shadow:0 0 12px rgba(127,217,209,0.2); }
</style>
</head>
<body>

<div class="stage">
  <svg id="sigSvg" viewBox="0 0 803 451" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#f5f0e6"/>
        <stop offset="55%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#d9c9a3"/>
      </linearGradient>
    </defs>
    <g id="strokeGroupGlow"></g>
    <g id="strokeGroupMain"></g>
    <circle class="i-dot" id="iDot" cx="634" cy="85" r="5.5" />
    <circle class="pen-dot" id="penDot" r="6"/>
  </svg>
</div>

<div class="loading-status" id="loadingText">LOADING... <span id="percentNum">0%</span></div>

<div class="control-panel">
  <button class="btn" onclick="simulateLoading()">模拟加载 (0-100%)</button>
  <button class="btn" onclick="resetAll()">重置</button>
</div>

<script>
const PATH_LOGO = "M146.014 136.867L182.514 120.367L219.014 100.367L253.514 76.8666L288.514 49.3666L315.514 25.8666L343.014 0.366638L325.014 49.3666L315.514 76.8666L304.514 100.367L295.014 120.367L284.014 145.367L272.514 172.367L261.014 199.367L248.514 223.367L236.014 247.367L221.514 274.867L204.514 300.867L190.514 325.367L174.014 349.367L158.014 369.867L138.514 392.367L116.514 413.367L99.5135 425.867L81.5135 437.367L63.5135 444.367L43.5135 449.867L25.5135 449.867L10.5135 439.867L0.51355 422.867L3.01355 397.367L10.5135 375.367L25.5135 352.867L40.0135 332.867L53.0135 317.867L63.5135 305.367L78.5135 291.867L95.0135 277.867L116.514 263.367L133.014 247.367L155.014 231.867L174.014 220.367L193.014 207.367L214.514 192.367L236.014 178.367L253.514 166.867L272.514 156.867L295.014 141.867L315.514 131.867L335.014 120.367L356.514 106.867L372.514 96.8666L389.014 87.3666L406.014 76.8666L421.514 67.8666L439.014 57.3666L455.014 49.3666L473.514 39.3666L461.014 57.3666L451.014 71.3666L444.014 83.8666L436.014 96.8666L429.514 109.867L432.014 122.867L439.014 131.867L453.014 134.367L473.514 126.367L489.014 120.367L507.014 109.867L525.014 100.367L540.514 90.3666L557.514 80.8666L576.514 67.8666L593.514 54.8666L610.514 39.3666L630.014 29.8666L651.514 21.3666L663.014 21.3666L642.014 29.8666L621.014 39.3666L607.014 49.3666L593.514 60.8666L576.514 76.8666L567.014 90.3666L560.514 106.867L570.014 116.367C575.014 114.2 585.414 109.867 587.014 109.867C588.614 109.867 599.014 103.533 604.014 100.367L617.514 90.3666L632.514 78.8666L645.014 71.3666L655.514 60.8666L665.514 52.8666L650 65L634 85L630 108L638 128L660 136L685 130L705 118L722 104L738 90";
const PATH_PROGRESS_BAR = "M25.5135 141.867L802.514 136.867";

function sampleSubpath(d, spacing = 3){
  const ns = "http://www.w3.org/2000/svg";
  const tmp = document.createElementNS(ns, "path");
  tmp.setAttribute("d", d);
  document.getElementById("sigSvg").appendChild(tmp);
  const len = tmp.getTotalLength();
  const pts = [];
  const steps = Math.max(2, Math.round(len / spacing));
  for(let i=0;i<=steps;i++){
    const p = tmp.getPointAtLength((i/steps)*len);
    pts.push([p.x, p.y]);
  }
  tmp.remove();
  return pts;
}

function smoothPath(points){
  if(points.length < 3) return "M" + points.map(p=>p.join(",")).join("L");
  let d = `M${points[0][0].toFixed(2)},${points[0][1].toFixed(2)} `;
  const n = points.length;
  for(let i=0;i<n-1;i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)} `;
  }
  return d.trim();
}

/* ---------- 全局引用：签名笔画 + 进度条，两者现在都由同一个 percent 驱动 ---------- */
let logoGlowEl, logoMainEl, logoLen, logoStartPt;
let progressGlowEl, progressMainEl, progressBarLength = 0;
let loadingTimer = null;
let stamped = false;

function initStructure(){
  const svg = document.getElementById("sigSvg");
  const glowGroup = document.getElementById("strokeGroupGlow");
  const mainGroup = document.getElementById("strokeGroupMain");
  glowGroup.innerHTML = "";
  mainGroup.innerHTML = "";
  stamped = false;

  document.getElementById("iDot").classList.remove("active");

  // 1. 签名主体 —— 不再自动播放固定动画，而是初始完全隐藏，
  //    之后跟随 loading 百分比揭示，这样"字是被写出来的"和"进度在走"是同一件事
  const ptsLogo = sampleSubpath(PATH_LOGO, 2.5);
  logoStartPt = ptsLogo[0];
  const smoothLogoD = smoothPath(ptsLogo);

  logoGlowEl = document.createElementNS(svg.namespaceURI, "path");
  logoGlowEl.setAttribute("d", smoothLogoD);
  logoGlowEl.setAttribute("class", "signature-path stroke-glow");
  glowGroup.appendChild(logoGlowEl);

  logoMainEl = document.createElementNS(svg.namespaceURI, "path");
  logoMainEl.setAttribute("d", smoothLogoD);
  logoMainEl.setAttribute("class", "signature-path stroke-main");
  mainGroup.appendChild(logoMainEl);

  logoLen = logoMainEl.getTotalLength();
  [logoGlowEl, logoMainEl].forEach(p=>{
    p.style.strokeDasharray = logoLen;
    p.style.strokeDashoffset = logoLen; // 完全隐藏，等待 percent 驱动
  });

  // 2. 加载条
  const ptsBar = sampleSubpath(PATH_PROGRESS_BAR, 2.5);
  const smoothBarD = smoothPath(ptsBar);

  progressGlowEl = document.createElementNS(svg.namespaceURI, "path");
  progressGlowEl.setAttribute("d", smoothBarD);
  progressGlowEl.setAttribute("class", "signature-path progress-line-glow");
  glowGroup.appendChild(progressGlowEl);

  progressMainEl = document.createElementNS(svg.namespaceURI, "path");
  progressMainEl.setAttribute("d", smoothBarD);
  progressMainEl.setAttribute("class", "signature-path progress-line-main");
  mainGroup.appendChild(progressMainEl);

  progressBarLength = progressMainEl.getTotalLength();
  [progressGlowEl, progressMainEl].forEach(p=>{
    p.style.strokeDasharray = progressBarLength;
    p.style.strokeDashoffset = progressBarLength;
  });

  // 钢笔归位到签名起点，先不可见
  const penDot = document.getElementById("penDot");
  penDot.style.transition = "none";
  penDot.setAttribute("cx", logoStartPt[0]);
  penDot.setAttribute("cy", logoStartPt[1]);
  penDot.style.opacity = "0";
  penDot.getBoundingClientRect();
  penDot.style.transition = "";
}

/* ---------- percent 同时驱动：签名揭示 + 进度条揭示 + 笔尖实时定位 ---------- */
function updateProgressBar(percent){
  percent = Math.max(0, Math.min(100, percent));
  const t = percent / 100;

  const barOffset = progressBarLength - progressBarLength * t;
  progressGlowEl.style.strokeDashoffset = barOffset;
  progressMainEl.style.strokeDashoffset = barOffset;

  const logoOffset = logoLen - logoLen * t;
  logoGlowEl.style.strokeDashoffset = logoOffset;
  logoMainEl.style.strokeDashoffset = logoOffset;

  // 笔尖跟随签名当前写到的位置，像一支正在书写的钢笔
  if(!stamped){
    const penDot = document.getElementById("penDot");
    if(percent <= 0){
      penDot.style.opacity = "0";
    } else {
      const tip = logoMainEl.getPointAtLength(logoLen * t);
      penDot.style.transition = "opacity .2s ease"; // 移动时不做位置过渡，跟手更紧
      penDot.setAttribute("cx", tip.x.toFixed(2));
      penDot.setAttribute("cy", tip.y.toFixed(2));
      penDot.style.opacity = "0.9";
    }
  }

  document.getElementById("percentNum").innerText = `${Math.round(percent)}%`;

  if(percent >= 100 && !stamped){
    stamped = true;
    triggerIDotStamp();
  }
}

/* ---------- 100% 的“黄金瞬间”：笔尖平滑飞向 i 点位置，再按压落下 ---------- */
function triggerIDotStamp(){
  const penDot = document.getElementById("penDot");
  const iDot = document.getElementById("iDot");
  const loadingText = document.getElementById("loadingText");

  // 打开位置过渡，让笔尖从当前书写终点平滑飞到 i 点上方
  penDot.style.transition = "cx .32s cubic-bezier(0.22,1,0.36,1), cy .32s cubic-bezier(0.22,1,0.36,1), opacity .2s ease";
  penDot.style.opacity = "1";
  penDot.setAttribute("cx", "634");
  penDot.setAttribute("cy", "85");

  // 等飞行过渡结束后，再触发按压式的“盖章”反馈
  setTimeout(() => {
    penDot.style.transformOrigin = "634px 85px";
    penDot.style.animation = "stampPulse 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards";

    iDot.classList.add("active");
    loadingText.style.color = "var(--accent)";
    loadingText.style.textShadow = "0 0 10px rgba(127,217,209,0.5)";
    loadingText.innerHTML = "COMPLETE ✓";
  }, 340);
}

/* ---------- 模拟加载 ---------- */
function simulateLoading(){
  if(loadingTimer) clearInterval(loadingTimer);
  resetProgressBarOnly();

  let currentProgress = 0;
  loadingTimer = setInterval(() => {
    const step = Math.random() * 5 + 1.5;
    currentProgress += step;
    if(currentProgress >= 100){
      currentProgress = 100;
      clearInterval(loadingTimer);
    }
    updateProgressBar(currentProgress);
  }, 60);
}

function resetProgressBarOnly(){
  if(loadingTimer) clearInterval(loadingTimer);
  stamped = false;

  const penDot = document.getElementById("penDot");
  penDot.style.animation = "none";
  penDot.style.transition = "none";
  penDot.setAttribute("cx", logoStartPt[0]);
  penDot.setAttribute("cy", logoStartPt[1]);
  penDot.style.opacity = "0";
  penDot.getBoundingClientRect();
  penDot.style.transition = "opacity .2s ease";

  document.getElementById("iDot").classList.remove("active");
  document.getElementById("loadingText").style.color = "var(--accent)";
  document.getElementById("loadingText").style.textShadow = "none";
  document.getElementById("loadingText").innerHTML = 'LOADING... <span id="percentNum">0%</span>';
  updateProgressBar(0);
}

function resetAll(){
  resetProgressBarOnly();
  initStructure();
}

window.addEventListener("load", initStructure);
</script>
</body>
</html>
