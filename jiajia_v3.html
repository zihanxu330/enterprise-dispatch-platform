<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiajia Signature Animation V3</title>
<style>
  :root{
    --bg-0:#08090c;
    --bg-1:#0f1218;
    --ink-1:#f5f0e6;   /* warm ivory */
    --ink-2:#d9c9a3;   /* soft champagne gold */
    --accent:#7fd9d1;  /* muted jade — quiet, not the usual acid accent */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 38%, var(--bg-1) 0%, var(--bg-0) 70%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }

  .stage{
    position:relative;
    width:min(88vw,660px);
    display:flex;
    justify-content:center;
  }

  /* faint paper-grain / vignette so the ink has something to sit on */
  .stage::before{
    content:"";
    position:absolute;
    inset:-18% -10%;
    background:radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
    pointer-events:none;
    filter:blur(2px);
  }

  svg{ width:100%; height:auto; display:block; overflow:visible; }

  .signature-path{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
    stroke-dasharray:1 1; /* real value set by JS once length is known */
    stroke-dashoffset:1;
  }

  .stroke-glow{
    stroke:var(--accent);
    stroke-width:7;
    opacity:0.18;
    filter:blur(4px);
  }

  .stroke-main{
    stroke:url(#inkGradient);
    stroke-width:3.1;
  }

  .pen-dot{
    fill:var(--ink-1);
    opacity:0;
    filter:drop-shadow(0 0 6px rgba(245,240,230,0.65));
  }

  @keyframes reveal{
    to{ stroke-dashoffset:0; }
  }
  @keyframes dotPulse{
    0%{ opacity:0; transform:scale(0.4);}
    12%{ opacity:1; transform:scale(1);}
    88%{ opacity:1; transform:scale(1);}
    100%{ opacity:0; transform:scale(0.6);}
  }

  .caption{
    margin-top:34px;
    font-size:12px;
    letter-spacing:0.32em;
    color:rgba(245,240,230,0.38);
    text-transform:uppercase;
  }

  .reset-button{
    margin-top:26px;
    padding:9px 26px;
    font-size:13px;
    letter-spacing:0.05em;
    color:var(--ink-1);
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(127,217,209,0.45);
    border-radius:999px;
    cursor:pointer;
    transition:all .25s ease;
  }
  .reset-button:hover{
    background:rgba(127,217,209,0.12);
    box-shadow:0 0 18px rgba(127,217,209,0.25);
  }

  @media (prefers-reduced-motion: reduce){
    .signature-path{ animation:none !important; stroke-dashoffset:0 !important; }
    .pen-dot{ display:none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <svg id="sigSvg" viewBox="0 0 803 451" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#f5f0e6"/>
          <stop offset="55%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#d9c9a3"/>
        </linearGradient>
      </defs>

      <!-- glow + main pass exist for BOTH strokes; built by JS -->
      <g id="strokeGroupGlow"></g>
      <g id="strokeGroupMain"></g>

      <circle class="pen-dot" id="penDot" r="5"/>
    </svg>
  </div>

  <div class="caption">jiajia</div>
  <button class="reset-button" onclick="restartAnimation()">もう一度描く</button>

<script>
/* ---------- 1. raw data: original hand-digitised polyline(s) ---------- */
const RAW_SUBPATHS = [
  "M146.014 136.867L182.514 120.367L219.014 100.367L253.514 76.8666L288.514 49.3666L315.514 25.8666L343.014 0.366638L325.014 49.3666L315.514 76.8666L304.514 100.367L295.014 120.367L284.014 145.367L272.514 172.367L261.014 199.367L248.514 223.367L236.014 247.367L221.514 274.867L204.514 300.867L190.514 325.367L174.014 349.367L158.014 369.867L138.514 392.367L116.514 413.367L99.5135 425.867L81.5135 437.367L63.5135 444.367L43.5135 449.867L25.5135 449.867L10.5135 439.867L0.51355 422.867L3.01355 397.367L10.5135 375.367L25.5135 352.867L40.0135 332.867L53.0135 317.867L63.5135 305.367L78.5135 291.867L95.0135 277.867L116.514 263.367L133.014 247.367L155.014 231.867L174.014 220.367L193.014 207.367L214.514 192.367L236.014 178.367L253.514 166.867L272.514 156.867L295.014 141.867L315.514 131.867L335.014 120.367L356.514 106.867L372.514 96.8666L389.014 87.3666L406.014 76.8666L421.514 67.8666L439.014 57.3666L455.014 49.3666L473.514 39.3666L461.014 57.3666L451.014 71.3666L444.014 83.8666L436.014 96.8666L429.514 109.867L432.014 122.867L439.014 131.867L453.014 134.367L473.514 126.367L489.014 120.367L507.014 109.867L525.014 100.367L540.514 90.3666L557.514 80.8666L576.514 67.8666L593.514 54.8666L610.514 39.3666L630.014 29.8666L651.514 21.3666L663.014 21.3666L642.014 29.8666L621.014 39.3666L607.014 49.3666L593.514 60.8666L576.514 76.8666L567.014 90.3666L560.514 106.867L570.014 116.367C575.014 114.2 585.414 109.867 587.014 109.867C588.614 109.867 599.014 103.533 604.014 100.367L617.514 90.3666L632.514 78.8666L645.014 71.3666L655.514 60.8666L665.514 52.8666L650 65L634 85L630 108L638 128L660 136L685 130L705 118L722 104L738 90L750 74",
  "M25.5135 141.867L802.514 136.867"
];

/* ---------- 2. sample each subpath into dense points using the browser's own path engine ---------- */
function sampleSubpath(d, spacing = 3){
  const ns = "http://www.w3.org/2000/svg";
  const tmp = document.createElementNS(ns, "path");
  tmp.setAttribute("d", d);
  document.getElementById("sigSvg").appendChild(tmp);
  const len = tmp.getTotalLength();
  const pts = [];
  const steps = Math.max(2, Math.round(len / spacing));
  for(let i=0;i<=steps;i++){
    const p = tmp.getPointAtLength((i/steps)*len);
    pts.push([p.x, p.y]);
  }
  tmp.remove();
  return pts;
}

/* ---------- 3. Catmull-Rom -> smooth cubic-bezier path (centripetal, no overshoot) ---------- */
function smoothPath(points){
  if(points.length < 3){
    return "M" + points.map(p=>p.join(",")).join("L");
  }
  let d = `M${points[0][0].toFixed(2)},${points[0][1].toFixed(2)} `;
  const n = points.length;
  for(let i=0;i<n-1;i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6;
    const c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6;
    const c2y = p2[1] - (p3[1]-p1[1])/6;
    d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)} `;
  }
  return d.trim();
}

/* ---------- 4. build the smoothed strokes and wire up the sequenced reveal ---------- */
const SPEED = 130; // px per second of "ink" — controls pacing so longer strokes naturally take longer
let animState = { paths: [], dot: null, totalDelay: 0 };

function buildSignature(){
  const svg = document.getElementById("sigSvg");
  const glowGroup = document.getElementById("strokeGroupGlow");
  const mainGroup = document.getElementById("strokeGroupMain");
  glowGroup.innerHTML = "";
  mainGroup.innerHTML = "";
  animState.paths = [];

  let cursorTime = 0.15; // small lead-in before the pen "touches down"
  const pauseBetween = 0.35;

  RAW_SUBPATHS.forEach((raw, idx) => {
    const pts = sampleSubpath(raw, 2.5);
    const smoothD = smoothPath(pts);

    const glow = document.createElementNS(svg.namespaceURI, "path");
    glow.setAttribute("d", smoothD);
    glow.setAttribute("class", "signature-path stroke-glow");
    glowGroup.appendChild(glow);

    const main = document.createElementNS(svg.namespaceURI, "path");
    main.setAttribute("d", smoothD);
    main.setAttribute("class", "signature-path stroke-main");
    mainGroup.appendChild(main);

    const len = main.getTotalLength();
    const duration = Math.max(0.5, len / SPEED);

    [glow, main].forEach(p=>{
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.animation = `reveal ${duration}s cubic-bezier(0.65,0,0.35,1) ${cursorTime}s forwards`;
    });

    animState.paths.push({ el: main, start: pts[0], duration, delay: cursorTime });

    cursorTime += duration + pauseBetween;
  });

  animState.totalDelay = cursorTime;
  scheduleDot();
}

/* pen-down dot at the very first stroke of the whole signature, for a touch of realism */
function scheduleDot(){
  const dot = document.getElementById("penDot");
  const first = animState.paths[0];
  if(!first) return;
  dot.setAttribute("cx", first.start[0]);
  dot.setAttribute("cy", first.start[1]);
  dot.style.animation = "none";
  dot.getBoundingClientRect();
  dot.style.animation = `dotPulse ${Math.min(0.9, first.duration*0.6)}s ease-out ${Math.max(0, first.delay-0.1)}s forwards`;
}

function restartAnimation(){
  buildSignature();
}

window.addEventListener("load", buildSignature);
</script>
</body>
</html>
